name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: "11"
          distribution: "temurin"
          cache: maven
          server-id: strassburger
          server-username: SMR_USERNAME
          server-password: SMR_TOKEN

      - name: Publish to maven.strassburger.org
        run: mvn --batch-mode clean deploy
        env:
          SMR_USERNAME: ${{ secrets.SMR_USERNAME }}
          SMR_TOKEN: ${{ secrets.SMR_TOKEN }}
